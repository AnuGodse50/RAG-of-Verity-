services:
  rag:
    image: agentic-rag:shared-models
    build: .
    ports:
      - "127.0.0.1:${RAG_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RAG_ENV: production
      RAG_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY in .env}
      RAG_ADMIN_API_KEY: ${RAG_ADMIN_API_KEY:?Set RAG_ADMIN_API_KEY in .env}
      RAG_DATA_DIR: /app/data
      RAG_PROJECTS_DIR: /app/projects
      RAG_AGENTS_DIR: /app/agents
      RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-26214400}
      HF_HOME: /app/data/hf-cache
      HF_HUB_CACHE: /app/data/hf-cache/hub
    volumes:
      - ./data:/app/data
      - ./projects:/app/projects
      - ./agents:/app/agents:ro
      - ./samples:/app/samples:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
