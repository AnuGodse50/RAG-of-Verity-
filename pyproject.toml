[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configurable-rag"
version = "0.1.0"
description = "Dataset-agnostic, project-configured RAG service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9",
  "pydantic>=2.8", "pydantic-settings>=2.4", "PyYAML>=6.0",
  "chromadb>=0.5", "sentence-transformers>=3.0", "numpy>=1.26",
  "rank-bm25>=0.2.2", "pypdf>=5.0", "python-docx>=1.1",
  "beautifulsoup4>=4.12", "markdown>=3.7", "openpyxl>=3.1",
  "pandas>=2.2", "xlrd>=2.0", "httpx>=0.27", "sqlalchemy>=2.0", "python-dotenv>=1.0", "anthropic>=0.34", "qdrant-client>=1.11"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]
ocr = ["pytesseract>=0.3.13", "Pillow>=10.0"]

[project.scripts]
rag = "cli.main:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["core*", "loaders*", "chunkers*", "embedders*", "stores*", "retrievers*", "llms*", "api*", "cli*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

